# franka_controllers.yaml
# Controller configuration for Franka Panda — works with both Gazebo and real hardware.
#
# Usage:
#   Gazebo:        passed via --ros-args --params-file (see launch_gazebo.sh)
#   Real hardware: passed to franka_bringup via ros2_controllers_path argument
#
# To verify active controllers at runtime:
#   ros2 control list_controllers

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz — must match franka_hardware's 1 kHz cycle

    # Declare controllers. Activation is done in launch_gazebo.sh.
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ── forward_position_controller ──────────────────────────────────────────────
# Subscribes to /forward_position_controller/commands (Float64MultiArray, 7 rad)
# and forwards directly to the hardware position interface.
forward_position_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    interface_name: position

# ── Gazebo PID gains ──────────────────────────────────────────────────────────
# Required only for Gazebo (gazebo_ros2_control uses these for position tracking).
# Not used when running against real franka_hardware.
# ← [ADJUST] increase p if joints are sluggish; lower d if they oscillate.
gazebo_ros2_control:
  ros__parameters:
    joints:
      panda_joint1:
        p: 1200.0
        d: 50.0
        i: 0.0
        i_clamp: 0.0
      panda_joint2:
        p: 1200.0
        d: 50.0
        i: 0.0
        i_clamp: 0.0
      panda_joint3:
        p: 1200.0
        d: 50.0
        i: 0.0
        i_clamp: 0.0
      panda_joint4:
        p: 1200.0
        d: 50.0
        i: 0.0
        i_clamp: 0.0
      panda_joint5:
        p: 250.0
        d: 10.0
        i: 0.0
        i_clamp: 0.0
      panda_joint6:
        p: 250.0
        d: 10.0
        i: 0.0
        i_clamp: 0.0
      panda_joint7:
        p: 250.0
        d: 5.0
        i: 0.0
        i_clamp: 0.0
